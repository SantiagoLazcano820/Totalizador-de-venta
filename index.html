<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Totalizador</title>
  </head>
  <body>
    <h1>Totalizador</h1>
    <form id="totalizador-form">
      <label for="cantidad">Cantidad de item:</label>
      <input type="number" id="cantidad" />
      <label for="precio">Precio por item:</label>
      <input type="number" id="precio" />
      <label for="estado">Código de estado:</label>
      <select id="estado">
        <option value="CA" selected>CA - California</option>
        <option value="UT">UT - Utah</option>
        <option value="NV">NV - Nevada</option>
        <option value="TX">TX - Texas</option>
        <option value="AL">AL - Alabama</option>
      </select>
      <label for="categoria">Categoría:</label>
      <select id="categoria">
        <option value="varios" selected>Varios</option>
        <option value="alimentos">Alimentos</option>
        <option value="bebidas-alcohólicas">Bebidas alcohólicas</option>
        <option value="material-escritorio">Material de escritorio</option>
        <option value="muebles">Muebles</option>
        <option value="electonicos">Electrónicos</option>
        <option value="vestimenta">Vestimenta</option>
      </select>
      <input type="submit" value="Totalizar" id="totalizar-button" />
      <input type="button" value="Cancelar Compra" id="cancelar-button" />
      <input type="button" value="Confirmar Compra" id="confirmar-button" />
    </form>
    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
